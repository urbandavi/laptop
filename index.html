<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékadatok</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="container-fluid product-page">
        <section class="product-top">
            <div class="gallery">
                <div class="main-image-frame">
                    <img src="" id="main-img" alt="" class="main-image">
                </div>

                <div class="thumbnail-list" aria-label="Termék képei">
                    <button class="thumbnail active" type="button" aria-label="Első termékkép">
                        <img src="https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=240&q=80"
                            alt="">
                    </button>
                    <button class="thumbnail" type="button" aria-label="Második termékkép">
                        <img src="https://images.unsplash.com/photo-1588872657578-7efd1f1555ed?auto=format&fit=crop&w=240&q=80"
                            alt="">
                    </button>
                    <button class="thumbnail" type="button" aria-label="Harmadik termékkép">
                        <img src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=240&q=80"
                            alt="">
                    </button>
                    <button class="thumbnail" type="button" aria-label="Negyedik termékkép">
                        <img src="https://images.unsplash.com/photo-1580522154071-c6ca47a859ad?auto=format&fit=crop&w=240&q=80"
                            alt="">
                    </button>
                </div>
            </div>

            <div class="product-details">
                <span class="product-tag">ÚJ</span>
                <h1 id="p-name"></h1>
                <p id="p-desc" class="product-subtitle"></p>
                <p id="p-rating" class="rating-line"></p>
                <p id="price" class="product-price"></p>
                <p id="p-stock" class="stock-badge"></p>

                <div class="purchase-actions">
                    <button class="btn btn-primary add-to-cart" type="button">
                        <i class="bi bi-cart3" aria-hidden="true"></i>
                        Kosárba
                    </button>
                    <button class="btn btn-outline-secondary favorite-button" type="button">
                        <i class="bi bi-heart" aria-hidden="true"></i>
                        Kedvencekhez
                    </button>
                </div>
            </div>

            <aside class="manufacturer-card" aria-label="Termék információk">
                <div class="manufacturer-row">
                    <span class="manufacturer-icon">
                        <i class="bi bi-box-seam-fill" aria-hidden="true"></i>
                    </span>
                    <div>
                        <span class="meta-label">Gyártó</span>
                        <p id="manuf-name"></p>
                    </div>
                </div>

                <div class="manufacturer-row">
                    <span class="meta-icon">
                        <i class="bi bi-globe2" aria-hidden="true"></i>
                    </span>
                    <div>
                        <span class="meta-label">Származási ország</span>
                        <p id="manuf-country"></p>
                    </div>
                </div>

                <div class="manufacturer-row">
                    <span class="meta-icon">
                        <i class="bi bi-shield-check" aria-hidden="true"></i>
                    </span>
                    <div>
                        <span class="meta-label">Garancia</span>
                        <p></p>
                    </div>
                </div>

                <div class="manufacturer-row">
                    <span class="meta-icon">
                        <i class="bi bi-truck" aria-hidden="true"></i>
                    </span>
                    <div>
                        <span class="meta-label">Szállítás</span>
                        <p></p>
                    </div>
                </div>
            </aside>
        </section>

        <nav class="product-tabs" aria-label="Termék részletei">
            <a class="tab-link active" href="#desc">Leírás</a>
            <a class="tab-link" href="#info">Tulajdonságok</a>
            <a class="tab-link" href="#comments">Vélemények</a>
        </nav>

        <section class="product-bottom">
            <div class="description-column">
                <div id="desc"></div>

                <div class="feature-grid">
                    <article class="feature-card">
                        <i class="bi bi-lightning-charge" aria-hidden="true"></i>
                        <span>Kiemelkedő<br>teljesítmény</span>
                    </article>
                    <article class="feature-card">
                        <i class="bi bi-controller" aria-hidden="true"></i>
                        <span>Tökéletes<br>játékélmény</span>
                    </article>
                    <article class="feature-card">
                        <i class="bi bi-display" aria-hidden="true"></i>
                        <span>Lenyűgöző<br>kijelző</span>
                    </article>
                    <article class="feature-card">
                        <i class="bi bi-gear" aria-hidden="true"></i>
                        <span>Fejlesztéshez<br>ideális</span>
                    </article>
                </div>
            </div>

            <section id="info" class="specifications-column">
                <h2>Főbb jellemzők</h2>
                <div class="specifications-card">
                    <p id="proc"></p>
                    <p id="ram"></p>
                    <p id="storage"></p>
                    <p id="graphics"></p>
                </div>
            </section>

            <section class="reviews-column">
                <h2>Vásárlói vélemények</h2>
                <div id="comments">
                    <article class="comment">
                        <div class="review-avatar" aria-hidden="true"></div>
                        <div class="review-content">
                            <div class="review-heading">
                                <p id="name1"></p>
                                <time></time>
                            </div>
                            <div class="review-stars" aria-hidden="true"></div>
                            <p id="comm1"></p>
                        </div>
                    </article>

                    <article class="comment">
                        <div class="review-avatar" aria-hidden="true"></div>
                        <div class="review-content">
                            <div class="review-heading">
                                <p id="name2"></p>
                                <time></time>
                            </div>
                            <div class="review-stars" aria-hidden="true"></div>
                            <p id="comm2"></p>
                        </div>
                    </article>
                </div>

                <a class="all-reviews" href="#comments">
                    Összes vélemény megtekintése
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </a>
            </section>
        </section>

        <p id="demo"></p>
    </main>

    <script src="index.js"></script>
</body>

</html>
